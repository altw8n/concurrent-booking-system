spring.application.name=concurrent-booking-system

spring.datasource.url=jdbc:postgresql://localhost:5432/booking_db
spring.datasource.username=booking_user
spring.datasource.password=booking_password

spring.jpa.hibernate.ddl-auto=validate
# Keep the persistence context inside service transactions, including retries.
spring.jpa.open-in-view=false

# Use one strategy per application run: naive, optimistic or pessimistic.
booking.strategy=naive
# Additional attempts after an optimistic conflict; 0 means one attempt in total.
booking.optimistic.max-retries=0
# Maximum wait for each database lock acquisition in the pessimistic transaction.
booking.pessimistic.lock-timeout-ms=2000
